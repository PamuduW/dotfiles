name: Validate

on:
  workflow_dispatch:
  # Daily at 10:00 Asia/Colombo (04:30 UTC, which is what cron takes) rather
  # than on every push. What breaks this suite is
  # mostly not a commit: the runner image, apt, tool versions, and the release
  # downloads the installers pull. `workflow_dispatch` covers a change here
  # that wants checking before tomorrow.
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Both products resolve shared code from a dotfiles-shared checkout beside
      # their own, so CI lays the workspace out the way a real machine does
      # rather than special-casing the path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dotfiles
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PamuduW/dotfiles-shared
          path: dotfiles-shared
      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt ripgrep
      - name: Validate
        working-directory: dotfiles
        run: scripts/validate.sh

  bootstrap:
    name: Fresh-machine bootstrap
    # Weekly only: it installs a machine's worth of software, and it is the one
    # check that exercises the published state of all three repositories the way
    # an operator meets them -- curl the script, clone three repos, install.
    #
    # Nothing else covers this path. It found a CONTRACT mismatch that every
    # unit suite passed straight through, because the suites resolve a checkout
    # that is already correct.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run bootstrap as a fresh user
        run: |
          set -uo pipefail
          sudo useradd -m -s /bin/bash op
          echo 'op ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/op >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq util-linux

          curl -fsSL https://raw.githubusercontent.com/PamuduW/dotfiles/main/bootstrap.sh -o /tmp/b.sh
          chmod a+r /tmp/b.sh
          sudo chmod 777 /tmp

          # script(1) gives the run a controlling terminal. su alone does not,
          # and the component menu reads /dev/tty; without this the install
          # stops on "No such device or address". 'q' closes that menu.
          sudo -u op bash -lc \
            "printf 'q\n' | timeout 1200 script -qec 'BOOTSTRAP_SELECTION=2 bash /tmp/b.sh' /tmp/typescript" \
            </dev/null || true

          echo "=== what the run printed ==="
          sudo sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/typescript | tail -40

      - name: The three repositories landed, shared first
        run: |
          set -eu
          for repo in dotfiles-shared dotfiles; do
            test -d "/home/op/$repo/.git" || { echo "missing: $repo"; exit 1; }
          done
          echo "shared CONTRACT: $(cat /home/op/dotfiles-shared/CONTRACT)"
          # The whole point of the gate: the products must start.
          sudo -u op env NO_COLOR=1 /home/op/dotfiles/bin/bin/dotfiles help >/dev/null
          echo "dotfiles CLI runs from the bootstrapped checkout"
